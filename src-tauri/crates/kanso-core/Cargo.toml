[package]
name = "kanso-core"
version = "0.1.0"
edition = "2021"
description = "Core game discovery parsers, metadata clients, title cleaner, and local store for Kanso"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
walkdir = "2.5"
# Already in the dependency tree through Tauri; decodes the font files embedded in themes
base64 = "0.22"
# Already in the dependency tree through ureq; checks the addresses plugins ask for
url = "2.5"
# Lists running processes to measure play time
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# QuickJS: the sandbox community plugins run in (no file, network or UI access of their own)
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
# Same version winreg already pulls in; used to enumerate fixed drives for the Xbox scanner
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.14"
