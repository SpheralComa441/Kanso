[package]
name = "kanso-core"
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Core game discovery parsers, metadata clients, title cleaner, and local store for Kanso"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
walkdir = "2.5"
# Already in the dependency tree through Tauri; decodes the font files embedded in themes
base64 = "0.22"
# Already in the dependency tree through ureq; checks the addresses plugins ask for
url = "2.5"
# Lists running processes to measure play time
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# QuickJS: the sandbox community plugins run in (no file, network or UI access of their own)
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
# Reads the game configurations (YAML) inside Ubisoft Connect's local product cache
yaml-rust2 = { version = "0.13", default-features = false }
# Already in the dependency tree through ureq's TLS; opens the envelope (AES-256-GCM) a current
# Ubisoft Connect client keeps its local product cache in
ring = "0.17"
# Reads news feeds that are not written in UTF-8 (windows-1251, ISO-8859-1…)
encoding_rs = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
# Same version winreg already pulls in; used to enumerate fixed drives for the Xbox scanner and
# to protect the sign-in tokens of the store accounts with the Windows user's own key (DPAPI),
# and to ask Windows who signed a DLSS library before it replaces a game's own (WinTrust)
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3.14"
