[workspace]
members = [".", "crates/kanso-core"]
default-members = ["."]
resolver = "2"

[package]
name = "kanso"
version = "0.1.0"
description = "Kanso — Minimalist Windows Game Launcher"
authors = ["Kanso Contributors"]
edition = "2021"

[lib]
name = "kanso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kanso-core = { path = "crates/kanso-core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
