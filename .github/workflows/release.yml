name: Release

# Builds the installers of the version written in src-tauri/tauri.conf.json and opens a DRAFT
# release with them attached. Nothing is public until someone reads the draft and presses
# Publish. Run it by hand from the Actions tab, or by pushing the tag v<version>.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build the installers and draft the release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The release is named after the version the app itself carries. A published release
      # is never replaced; a draft left by an earlier run of this workflow is.
      - name: Read the version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in tauri.conf.json ($version)."
            exit 1
          fi
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "::error::Kanso $version is already published. Set a new version first (docs/DEVELOPMENT.md, Releasing)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_draft=$state" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run core unit tests on Windows
        run: cargo test -p kanso-core --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows installers (.exe & .msi)
        run: npx tauri build

      - name: Collect the installers and their SHA-256 sums
        shell: bash
        run: |
          mkdir release
          cp src-tauri/target/release/bundle/nsis/*.exe release/
          cp src-tauri/target/release/bundle/msi/*.msi release/
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The notes are the version's section of CHANGELOG.md, followed by how to install
      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Installing

          Download the `-setup.exe` file below and run it (the `.msi` is the same app, for those who prefer that kind of installer). Windows 10 or 11, 64-bit.

          The installer is not signed with a publisher certificate yet, so Windows SmartScreen says it does not recognise the app: choose **More info**, then **Run anyway**. To be sure the file is the one built here, compare its SHA-256 sum with `SHA256SUMS.txt`:

          ```
          Get-FileHash .\Kanso_*_x64-setup.exe
          ```
          EOF
          cat notes.md

      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_DRAFT: ${{ steps.version.outputs.previous_draft }}
        run: |
          if [ "$PREVIOUS_DRAFT" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" release/* \
            --draft \
            --title "Kanso $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
